<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice</title>
</head>

<body>
    <header>Calculatrice</header>

    <main>
        <div style="display: flex">
            <form method="POST" action="/calculatrice ">
                <div style="display: flex">
                    <input type="number" name="num1" placeholder="Nombre 1" required />
                    <select name="operation">
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="*">*</option>
                    </select>
                    <input type="number" name="num2" placeholder="Nombre 2" required />
                    <button type="submit">=</button>
                </div>

            </form>
            <p>Résultat : </p>
            {% if result is defined %}
            <p>{{ result }}</p>
            {% endif %}

        </div>
    </main>


    <footer>Exercice 3</footer>

</body>

</html>
